<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시장 자금흐름 보드</title>
<style>
:root{--bg:#0b0e13;--card:#151a22;--card2:#1b212b;--line:#252c37;--txt:#e8ecf2;
--sub:#8993a4;--dim:#5d6675;--up:#ff5f6d;--dn:#4d94ff;--acc:#7c9cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
padding:14px 12px 70px;font-size:14px}
header{margin-bottom:14px}
h1{font-size:18px;margin:0 0 3px;letter-spacing:-.3px}
.meta{color:var(--dim);font-size:12px}
.tabs{display:flex;gap:6px;margin:12px 0 14px}
.tab{flex:1;text-align:center;padding:8px 0;background:var(--card);border:1px solid var(--line);
border-radius:9px;font-size:13px;color:var(--sub)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#0b0e13;font-weight:600}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.kpi .k{color:var(--dim);font-size:11px;margin-bottom:4px}
.kpi .v{font-size:17px;font-weight:600;letter-spacing:-.4px}
.kpi .c{font-size:11.5px;margin-top:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;
margin-bottom:9px;overflow:hidden}
summary{padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;
display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';color:var(--dim);font-size:12px;transition:.2s}
details[open] summary::after{transform:rotate(180deg)}
.body{padding:0 14px 12px}
.note{color:var(--dim);font-size:11.5px;margin:0 0 10px}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:none}
td.n{font-size:13.5px}
td.v{text-align:right;white-space:nowrap;font-size:13.5px;font-variant-numeric:tabular-nums}
.sub{color:var(--dim);font-size:11px;margin-top:3px;line-height:1.45}
.lead td.n{padding-left:12px;color:var(--sub);font-size:12.5px}
.lead{background:rgba(255,255,255,.015)}
.badge{display:inline-block;padding:2px 6px;border-radius:5px;font-size:11.5px;margin-top:3px}
.up{background:rgba(255,95,109,.13);color:var(--up)}
.dn{background:rgba(77,148,255,.13);color:var(--dn)}
.na{background:rgba(255,255,255,.05);color:var(--dim)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:13px 14px;font-size:13.5px;line-height:1.72;white-space:pre-wrap;margin-bottom:9px}
.sum b{display:block;color:var(--acc);font-size:12px;letter-spacing:.5px;
margin:0 0 6px;font-weight:600}
select{background:var(--card);color:var(--txt);border:1px solid var(--line);
border-radius:9px;padding:8px 10px;font-size:13px;width:100%;margin-bottom:12px}
.err{color:var(--sub);line-height:1.7;padding:20px 4px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:13px 12px 8px;margin-bottom:9px}
.chart .t{font-size:13px;font-weight:600;margin-bottom:2px}
.chart .s{color:var(--dim);font-size:11px;margin-bottom:8px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>시장 자금흐름 보드</h1>
  <div class="meta" id="meta">불러오는 중...</div>
</header>
<div class="tabs">
  <div class="tab on" id="t1">지표</div>
  <div class="tab" id="t2">추이</div>
</div>
<div id="p1">
  <select id="arc" class="hide"></select>
  <div class="kpi" id="kpi"></div>
  <div id="sum"></div>
  <div id="app"></div>
</div>
<div id="p2" class="hide"></div>
<script>
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[<>&]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function cls(c){if(!c)return 'na';return String(c).trim().charAt(0)==='-'?'dn':'up'}
function num(t){if(!t)return null;
  var m=String(t).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null}

function findItem(title,kw){
  for(var i=0;i<CUR.sections.length;i++){var s=CUR.sections[i];
    if(s.title.indexOf(title)<0)continue;
    for(var j=0;j<s.items.length;j++){
      if(s.items[j].name.indexOf(kw)>=0)return s.items[j]}}
  return null}

function kpi(){
  var picks=[['매크로','변동성 VIX','VIX'],['매크로','달러지수','달러'],
             ['매크로','HYG/TLT','위험선호'],['프리미엄','BTC','BTC 프리미엄']];
  var h='';
  for(var i=0;i<picks.length;i++){
    var it=findItem(picks[i][0],picks[i][1]);
    if(!it)continue;
    h+='<div><div class="k">'+picks[i][2]+'</div><div class="v">'+
       esc(it.value)+'</div><div class="c '+
       (cls(it.change)==='up'?'':'')+'"><span class="badge '+cls(it.change)+'">'+
       (esc(it.change)||'-')+'</span></div></div>'}
  $('#kpi').innerHTML=h}

function summary(){
  if(!CUR.summary){$('#sum').innerHTML='';return}
  var parts=CUR.summary.split(/\n(?=\[)/),h='';
  for(var i=0;i<parts.length;i++){
    var m=parts[i].match(/^\[(.+?)\]\s*([\s\S]*)$/);
    if(m){h+='<div class="sum"><b>'+esc(m[1])+'</b>'+
      esc(m[2].trim()).replace(/^- /gm,'· ')+'</div>'}
    else if(parts[i].trim()){h+='<div class="sum">'+esc(parts[i].trim())+'</div>'}}
  $('#sum').innerHTML=h}

function tables(){
  var h='';
  for(var i=0;i<CUR.sections.length;i++){
    var s=CUR.sections[i],rows='';
    for(var j=0;j<s.items.length;j++){
      var it=s.items[j],lead=it.name.indexOf('└')>=0;
      rows+='<tr class="'+(lead?'lead':'')+'"><td class="n">'+
        esc(it.name.replace('└','↳'))+
        (it.comment?'<div class="sub">'+esc(it.comment)+'</div>':'')+
        '</td><td class="v">'+esc(it.value)+
        (it.change?'<br><span class="badge '+cls(it.change)+'">'+esc(it.change)+'</span>':'')+
        '</td></tr>'}
    h+='<details'+(i<2?' open':'')+'><summary>'+esc(s.title)+'</
