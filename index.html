<!DOCTYPE html>
<html lang="ko">
<head>

<title>시장 자금흐름 보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>

</header>
<div class="tabs">

  <div class="tab" id="t1">지표</div>
  <div class="tab" id="t2">미국주식</div>
  <div class="tab" id="t3">가상자산</div>

<!-- 종합: 헤드라인·시나리오·전망·전체 배분·할 일·리스크·성과 -->
<div id="p5"><p class="err">불러오는 중...</p></div>

<div id="p1" class="hide">

  <div class="kpi" id="kpi"></div>
  <div id="sum"></div>
  <div id="econ"></div>
  <div id="app"></div>
  <div id="tr-macro"></div>
</div>

<div id="p2" class="hide">
  <div id="st-op"></div>
  <div id="st-sec"></div>
  <div id="tr-stock"></div>
</div>
<!-- 가상자산: 내 코인 의견 + 코인 대시보드 + 코인 추이 -->
<div id="p3" class="hide">
  <div id="cr-op"></div>
  <div id="cr"><p class="err">불러오는 중...</p></div>
  <div id="tr-crypto"></div>
</div>
<!-- 기관: 13F·운용사 + 기관 언급 종목 의견 + COT -->
<div id="p4" class="hide">
  <div id="tf-op"></div>
  <div id="tf"><p class="err">불러오는 중...</p></div>
  <div id="cot"></div>
</div>
<script src="app.js"></script>
<script src="chart.js"></script>
<script src="crypto.js"></script>
<script src="thirteenf.js"></script>
<script src="opinion.js"></script>
</body>
</html>
