name: crypto-board
on:
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-board-push
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/crypto.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add crypto.json history/crypto.json history/picks.json
          git diff --staged --quiet && exit 0
          git commit -m "crypto update"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
