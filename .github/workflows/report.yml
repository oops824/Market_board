name: market-board
on:
  schedule:
    # 평일(한국 기준 월~금) 07:00 KST 한 번 분석. 미국장 마감 약 1시간 뒤라 당일 종가가 다 들어온다.
    # 주말은 미국장이 쉬어 데이터가 거의 그대로여서 돌리지 않는다.
    # 22:40 UTC 일~목 = 07:40 KST 월~금. 평소에는 07:00 에 수동 실행(workflow_dispatch)으로 돌고,
    # 이 예약은 그게 빠졌을 때의 백업이다(이미 그날 07시 이후로 갱신됐으면 바로 끝남)
    - cron: "40 22 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-board-push
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 07시 이후에 이미 갱신됐는지 확인 (백업 예약 실행용)
        id: chk
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime
          now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
          slot = now.replace(hour=7, minute=0, second=0, microsecond=0)
          if now.hour < 7:
              slot -= datetime.timedelta(days=1)
          try:
              u = json.load(open("data.json", encoding="utf-8")).get("updated", "")
              done = datetime.datetime.strptime(u[:16], "%Y-%m-%d %H:%M") >= slot
          except Exception:
              done = False
          print("skip=%d" % (1 if done and "${{ github.event_name }}" == "schedule" else 0))
          EOF
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with:
          python-version: "3.11"
      - run: python scripts/collect.py
        if: steps.chk.outputs.skip != '1'
      - run: python scripts/cot.py
        if: steps.chk.outputs.skip != '1'
      - run: python scripts/macro.py
        if: steps.chk.outputs.skip != '1'
      - run: python scripts/earnings.py
        if: steps.chk.outputs.skip != '1'
        continue-on-error: true
      - run: python scripts/releases.py
        if: steps.chk.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python scripts/analyze.py
        if: steps.chk.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 종합 투자의견: 실패해도 데이터 커밋은 진행 (이전 의견 유지)
      - run: pip install -q "anthropic>=1.9" && python scripts/opinion.py
        if: steps.chk.outputs.skip != '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPINION_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - if: steps.chk.outputs.skip != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "update"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
