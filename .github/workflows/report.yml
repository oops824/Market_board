name: market-board
on:
  schedule:
    # 매일 10:00·22:00 KST 두 번 분석. GitHub 예약 실행은 가끔 늦거나 누락되므로 40분 뒤 백업 실행
    # (같은 시간대에 이미 갱신됐으면 백업은 바로 끝남)
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
    - cron: "40 1 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-board-push
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 이번 시간대(10시·22시)에 이미 갱신됐는지 확인 (백업 예약 실행용)
        id: chk
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime
          now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
          slot = now.replace(minute=0, second=0, microsecond=0)
          if now.hour >= 22:
              slot = slot.replace(hour=22)
          elif now.hour >= 10:
              slot = slot.replace(hour=10)
          else:
              slot = (slot - datetime.timedelta(days=1)).replace(hour=22)
          try:
              u = json.load(open("data.json", encoding="utf-8")).get("updated", "")
              done = datetime.datetime.strptime(u[:16], "%Y-%m-%d %H:%M") >= slot
          except Exception:
              done = False
          print("skip=%d" % (1 if done and "${{ github.event_name }}" == "schedule" else 0))
          EOF
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with:
          python-version: "3.11"
      - run: python scripts/collect.py
        if: steps.chk.outputs.skip != '1'
      - run: python scripts/cot.py
        if: steps.chk.outputs.skip != '1'
      - run: python scripts/macro.py
        if: steps.chk.outputs.skip != '1'
      - run: python scripts/earnings.py
        if: steps.chk.outputs.skip != '1'
        continue-on-error: true
      - run: python scripts/releases.py
        if: steps.chk.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python scripts/analyze.py
        if: steps.chk.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 종합 투자의견: 실패해도 데이터 커밋은 진행 (이전 의견 유지)
      - run: pip install -q "anthropic>=1.9" && python scripts/opinion.py
        if: steps.chk.outputs.skip != '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPINION_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - if: steps.chk.outputs.skip != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "update"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
